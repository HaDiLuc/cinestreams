name: CineStreams CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Test Backend Spring Boot 3
  # ----------------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x server/mvnw

      - name: Run Backend Unit & Integration Tests
        run: |
          cd server
          ./mvnw test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/jwt_demo_db

  # ----------------------------------------------------------------------------
  # Job 2: Build & Lint Frontend React (Vite)
  # ----------------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Frontend Application
        run: |
          cd client
          npm run build

