# ==========================================================
# CẤU HÌNH GỬI MAIL QUA GMAIL SMTP (Spring Boot Starter Mail)
# ==========================================================
# Máy chủ SMTP của Google
spring.mail.host=smtp.gmail.com
# Cổng SMTP bảo mật chuẩn STARTTLS
spring.mail.port=587
# Tài khoản Gmail gửi thư (Có thể truyền qua biến môi trường SPRING_MAIL_USERNAME)
spring.mail.username=${SPRING_MAIL_USERNAME:hadiluc999@gmail.com}
# Mật khẩu ứng dụng 16 chữ số (Google App Password) - Khuyến nghị truyền qua biến môi trường SPRING_MAIL_PASSWORD
spring.mail.password=${SPRING_MAIL_PASSWORD:your_google_app_password_here}
# Bật xác thực người dùng khi gửi qua SMTP
spring.mail.properties.mail.smtp.auth=true
# Kích hoạt giao thức mã hóa STARTTLS để bảo mật đường truyền
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Chỉ định máy chủ SMTP tin cậy
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Timeout kết nối và phản hồi SMTP (tránh treo thread)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verification Code Configuration
app.auth.verification.expiration-minutes=5

# TASK-016: Cấu hình Multipart Upload kích thước lớn trong Spring Boot
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# TASK-017 & TASK-034: Đường dẫn lưu trữ Video & Chunks
app.upload.dir=uploads
app.upload.temp-dir=uploads/temp
app.upload.video-dir=uploads/videos
app.video.delete-source-after-transcode=false

# ==========================================================
# CẤU HÌNH LƯU TRỮ (Storage Service: local | minio)
# ==========================================================
storage.type=local
minio.endpoint=http://127.0.0.1:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=cinestreams
minio.bucket-name=cinestreams
minio.public-url=http://127.0.0.1:9000/cinestreams
