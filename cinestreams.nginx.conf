# ==============================================================================
# CineStreams - Nginx Reverse Proxy Configuration Template
# Đặt tại: /etc/nginx/sites-available/cinestreams
# Kích hoạt: ln -s /etc/nginx/sites-available/cinestreams /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name cinestreams999.io.vn 150.95.111.156;

    # Dung lượng tối đa cho upload video chunking (TASK-016)
    client_max_body_size 500M;

    # Gzip nén dữ liệu cho tốc độ tối ưu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # 1. Frontend React / Vite Single Page Application (SPA)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/cinestreams/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 2. Watch Party Real-time SSE & API (Tắt Buffering để truyền tin nhắn & sync tức thì)
    # --------------------------------------------------------------------------
    location /api/watchparty {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. Backend REST API (Reverse Proxy chuyển tiếp tới Spring Boot cổng 8088)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout 5 phút cho tác vụ ghép file và transcode FFmpeg
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 3. Phục vụ tài nguyên Upload & HLS Stream trực tiếp
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/cinestreams/backend/uploads/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
    }

    location /hls/ {
        alias /var/www/cinestreams/backend/uploads/videos/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
    }
}
